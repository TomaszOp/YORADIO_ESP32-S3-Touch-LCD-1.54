; PlatformIO Project Configuration File
;
[platformio]
default_envs = esp32-s3-devkitc1-n16r8

[env:esp32-s3-devkitc1-n16r8]
; Arduino Release v3.3.7 based on ESP-IDF v5.5.2.260206
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
; - framework-arduinoespressif32 @ 3.3.7 
; - framework-arduinoespressif32-libs @ 5.5.0+sha.87912cd291
;platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc1-n16r8
framework = arduino
;upload_protocol = espota
upload_speed = 460800

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.extra_flags = 
  -DBOARD_HAS_PSRAM

build_flags =
    -std=gnu++2a
    -fno-exceptions
    -Wall
    -Wextra
    -O2  ; gyorsabb futás, kisebb bináris.
    -fdiagnostics-color=always
    -DCORE_DEBUG_LEVEL=3  
    -std=gnu++20

build_unflags = -std=gnu++11  ; Eltávolítja az alapértelmezett C++11 beállítást

board_build.f_cpu = 240000000L

board_build.filesystem = spiffs
; czcionka 5x7 z polskimi znakami (locale/glcdfont) zamiast zwykłej z Adafruit GFX
extra_scripts = pre:copy_glcdfont.py

lib_deps = 
    adafruit/Adafruit GFX Library@^1.12.3
    adafruit/Adafruit ILI9341@^1.6.2
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/RTClib@^2.1.4

; Soros monitor
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; Wgrywanie przez WiFi (ArduinoOTA): program "pio run -e ota -t upload",
; system plików "pio run -e ota -t uploadfs". Radio musi działać w tej samej sieci.
; Wpisz IP radia (widoczne na ekranie i w routerze) albo podaj je przy wywołaniu: --upload-port 192.168.x.x
[env:ota]
extends = env:esp32-s3-devkitc1-n16r8
upload_protocol = espota
upload_port = 192.168.100.142
; upload_flags = --auth=myotapassword12345   ; tylko gdy w myoptions.h ustawiono OTA_PASS
